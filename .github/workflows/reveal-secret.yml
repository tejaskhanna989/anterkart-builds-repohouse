name: Reveal SSH Secret (temporary)

on:
  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Write secret to file
        env:
          OTAMZO_SSH_PASSWORD: ${{ secrets.OTAMZO_SSH_PASSWORD }}
        run: |
          printf '%s' "$OTAMZO_SSH_PASSWORD" > /tmp/secret.txt
          wc -c /tmp/secret.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-secret
          path: /tmp/secret.txt
          retention-days: 1
