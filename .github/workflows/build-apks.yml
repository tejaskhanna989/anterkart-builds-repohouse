name: Build APKs
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.22.0
        channel: stable
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Patch Flutter SDK gradle plugin (fix Groovy QName/XmlParser)
      shell: pwsh
      run: "$flutterGroovy = \"C:\\hostedtoolcache\\windows\\flutter\\3.22.0\\x64\\flutter\\packages\\flutter_tools\\gradle\\src\\main\\groovy\\flutter.groovy\"\nif (Test-Path $flutterGroovy) {\n  Write-Host\
        \ \"Found flutter.groovy at: $flutterGroovy\"\n  Copy-Item \"$flutterGroovy\" \"$flutterGroovy.backup\"\n  \n  $pythonScript = @\"\nimport re\n\nflutter_groovy = r'C:\\\\hostedtoolcache\\\\windows\\\
        \\flutter\\\\3.22.0\\\\x64\\\\flutter\\\\packages\\\\flutter_tools\\\\gradle\\\\src\\\\main\\\\groovy\\\\flutter.groovy'\n\nwith open(flutter_groovy, 'r') as f:\n    content = f.read()\n\nprint(f'Original\
        \ file size: {len(content)}')\n\n# 1. Remove the groovy.xml.QName import\ncontent = re.sub(r'import groovy\\.xml\\.QName\\s*\\n', '', content)\n\n# 2. Remove the groovy.xml.XmlParser import\ncontent\
        \ = re.sub(r'import groovy\\.xml\\.XmlParser\\s*\\n', '', content)\n\n# 3. Replace QName with javax.xml.namespace.QName (standard Java API)\ncontent = re.sub(r'\\bQName\\b', 'javax.xml.namespace.QName',\
        \ content)\n\n# 4. Add necessary imports after package declaration\nimports = '''import javax.xml.parsers.DocumentBuilderFactory\nimport javax.xml.parsers.DocumentBuilder\nimport org.w3c.dom.Document\n\
        import org.w3c.dom.Node\nimport org.w3c.dom.NodeList\nimport org.w3c.dom.Element\nimport org.xml.sax.InputSource\nimport java.io.StringReader\n'''\n\n# Add imports after package declaration\ncontent\
        \ = re.sub(r'(^package .*\\n)', r'\\1\\n' + imports + '\\n', content, count=1)\n\n# 5. Replace XmlParser usage with newXmlParser()\ncontent = re.sub(r'new XmlParser\\(\\)', 'newXmlParser()', content)\n\
        content = re.sub(r'new groovy\\.util\\.XmlParser\\(\\)', 'newXmlParser()', content)\ncontent = re.sub(r'new groovy\\.xml\\.XmlParser\\(\\)', 'newXmlParser()', content)\n\n# 5. Add the newXmlParser\
        \ helper method and XmlSlurperAdapter class\n# Find the first 'def ' or 'class ' and insert before it\nhelper_code = \"\"\"\n\ndef newXmlParser() {\n  return [parse: { input ->\n    def factory\
        \ = DocumentBuilderFactory.newInstance()\n    def builder = factory.newDocumentBuilder()\n    def inputSource = new InputSource(new StringReader(input))\n    def doc = builder.parse(inputSource)\n\
        \    return new XmlSlurperAdapter(doc)\n  }]\n}\n\nclass XmlSlurperAdapter {\n  Document doc\n  XmlSlurperAdapter(Document doc) { this.doc = doc }\n  def getAt(String name) {\n    def nodes = doc.getElementsByTagName(name)\n\
        \    if (nodes.getLength() == 0) return null\n    if (nodes.getLength() == 1) return new XmlSlurperAdapter(nodes.item(0))\n    def list = []\n    for (int i = 0; i < nodes.getLength(); i++) {\n\
        \      list << new XmlSlurperAdapter(nodes.item(i))\n    }\n    return list\n  }\n  String toString() { doc.getTextContent() }\n}\n\"\"\"\n\n# Find the first 'def ' or 'class ' and insert before\
        \ it\ncontent = re.sub(r'(^def |^class )', helper_code + r'\\1', content, count=1, flags=re.MULTILINE)\n\n# Write the patched file\nwith open(r'C:\\hostedtoolcache\\windows\\flutter\\3.22.0\\x64\\\
        flutter\\packages\\flutter_tools\\gradle\\src\\main\\groovy\\flutter.groovy', 'w') as f:\n    f.write(content)\n\nprint('Patched flutter.groovy successfully')\n\"@\n            Set-Content -Path\
        \ \"C:\\patch_flutter.py\" -Value $patchScript -Encoding UTF8\n            python3 \"C:\\patch_flutter.py\" 2>&1\n            if ($LASTEXITCODE -ne 0) {\n  Write-Error \"Python patch script failed\"\
        \n  exit 1\n            }\n            Write-Host \"Patched flutter.groovy successfully\"\n            Write-Host \"Checking for remaining QName/XmlParser references:\"\n            Select-String\
        \ -Pattern \"QName|XmlParser\" -Path \"C:\\hostedtoolcache\\windows\\flutter\\3.22.0\\x64\\flutter\\packages\\flutter_tools\\gradle\\src\\main\\groovy\\flutter.groovy\" | ForEach-Object { Write-Host\
        \ \"$($_.LineNumber): $($_.Line)\" } | Out-Host\n            if (-not (Select-String -Pattern \"QName|XmlParser\" -Path \"C:\\hostedtoolcache\\windows\\flutter\\3.22.0\\x64\\flutter\\packages\\\
        flutter_tools\\gradle\\src\\main\\groovy\\flutter.groovy\")) {\n  Write-Host \"No references found\"\n            }\n          } else {\n            Write-Host \"WARNING: flutter.groovy not found\
        \ at expected path!\"\n            Get-ChildItem -Path \"C:\\hostedtoolcache\\windows\\flutter\" -Filter \"flutter.groovy\" -Recurse -ErrorAction SilentlyContinue\n          }"
    - name: Create fresh Flutter projects
      shell: pwsh
      run: 'flutter create --template=app --platforms=android customer_new

        flutter create --template=app --platforms=android vendor_new

        flutter create --template=app --platforms=android rider_new'
    - name: Copy Dart code, assets, and Android config
      shell: pwsh
      run: '# Customer

        Copy-Item -Path customer\lib -Destination customer_new\lib -Recurse -Force

        Copy-Item -Path customer\assets -Destination customer_new\assets -Recurse -Force -ErrorAction SilentlyContinue

        Copy-Item -Path customer\pubspec.yaml -Destination customer_new\pubspec.yaml -Force

        Copy-Item -Path customer\android -Destination customer_new\android -Recurse -Force -ErrorAction SilentlyContinue

        # Vendor

        Copy-Item -Path vendor\lib -Destination vendor_new\lib -Recurse -Force

        Copy-Item -Path vendor\assets -Destination vendor_new\assets -Recurse -Force -ErrorAction SilentlyContinue

        Copy-Item -Path vendor\pubspec.yaml -Destination vendor_new\pubspec.yaml -Force

        Copy-Item -Path vendor\android -Destination vendor_new\android -Recurse -Force -ErrorAction SilentlyContinue

        # Rider

        Copy-Item -Path rider\lib -Destination rider_new\lib -Recurse -Force

        Copy-Item -Path rider\assets -Destination rider_new\assets -Recurse -Force -ErrorAction SilentlyContinue

        Copy-Item -Path rider\pubspec.yaml -Destination rider_new\pubspec.yaml -Force

        Copy-Item -Path rider\android -Destination rider_new\android -Recurse -Force -ErrorAction SilentlyContinue'
    - name: Get Flutter dependencies
      shell: pwsh
      run: 'Set-Location customer_new

        flutter pub get

        Set-Location ../vendor_new

        flutter pub get

        Set-Location ../rider_new

        flutter pub get'
    - name: Build Customer APK
      working-directory: customer_new
      shell: pwsh
      run: flutter build apk --release --split-per-abi
    - name: Build Vendor APK
      working-directory: vendor_new
      shell: pwsh
      run: flutter build apk --release --split-per-abi
    - name: Build Rider APK
      working-directory: rider_new
      shell: pwsh
      run: flutter build apk --release --split-per-abi
    - name: Upload Customer APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: customer-apk
        path: customer_new/build/app/outputs/flutter-apk/
        retention-days: 7
    - name: Upload Vendor APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vendor-apk
        path: vendor_new/build/app/outputs/flutter-apk/
        retention-days: 7
    - name: Upload Rider APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rider-apk
        path: rider_new/build/app/outputs/flutter-apk/
        retention-days: 7
