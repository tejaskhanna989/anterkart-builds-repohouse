name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create fresh Flutter projects
        run: |
          flutter create --template=app --platforms=android customer_new
          flutter create --template=app --platforms=android vendor_new
          flutter create --template=app --platforms=android rider_new

      - name: Copy Dart code and assets
        run: |
          # Customer
          cp -r customer/lib customer_new/lib
          cp -r customer/assets customer_new/assets 2>/dev/null || true
          cp customer/pubspec.yaml customer_new/pubspec.yaml
          # Vendor
          cp -r vendor/lib vendor_new/lib
          cp -r vendor/assets vendor_new/assets 2>/dev/null || true
          cp vendor/pubspec.yaml vendor_new/pubspec.yaml
          # Rider
          cp -r rider/lib rider_new/lib
          cp -r rider/assets rider_new/assets 2>/dev/null || true
          cp rider/pubspec.yaml rider_new/pubspec.yaml

      - name: Fix Kotlin version
        run: |
          for app in customer_new vendor_new rider_new; do
            # Update Kotlin plugin version in settings.gradle or build.gradle
            find $app/android -name "build.gradle*" -o -name "settings.gradle*" | while read f; do
              # For older format (build.gradle with ext.kotlin_version)
              sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' "$f"
              
              # For newer format (plugins block with kotlin android)
              sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' "$f"
              sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.24"/' "$f"
              sed -i 's/id "org.jetbrains.kotlin.android" version '\''[^'\'']*'\''/id "org.jetbrains.kotlin.android" version "1.9.24"/' "$f"
            done
          done
                # Force compileSdk/targetSdk to API 34 (stable on runner)
                for app in customer_new vendor_new rider_new; do
                  f="$app/android/app/build.gradle"
                  if [ -f "$f" ]; then
                    sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' "$f"
                    sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' "$f"
                    sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' "$f"
                    sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 34/' "$f"
                  fi
                done
          echo "---"
          grep -rn "kotlin" customer_new/android/build.gradle customer_new/android/settings.gradle* 2>/dev/null | head

      - name: Get Flutter dependencies
        run: |
          cd customer_new && flutter pub get
          cd ../vendor_new && flutter pub get
          cd ../rider_new && flutter pub get

      - name: Build Customer APK
        working-directory: customer_new
        run: flutter build apk --release --split-per-abi

      - name: Build Vendor APK
        working-directory: vendor_new
        run: flutter build apk --release --split-per-abi

      - name: Build Rider APK
        working-directory: rider_new
        run: flutter build apk --release --split-per-abi

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer_new/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor_new/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider_new/build/app/outputs/flutter-apk/
          retention-days: 7