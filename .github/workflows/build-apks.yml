name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.0'
          channel: 'stable'

      - name: Get Flutter dependencies (Customer)
        working-directory: customer
        run: flutter pub get

      - name: Get Flutter dependencies (Vendor)
        working-directory: vendor
        run: flutter pub get

      - name: Get Flutter dependencies (Rider)
        working-directory: rider
        run: flutter pub get

      - name: Build Customer APK (release)
        working-directory: customer
        run: flutter build apk --release --split-per-abi

      - name: Build Vendor APK (release)
        working-directory: vendor
        run: flutter build apk --release --split-per-abi

      - name: Build Rider APK (release)
        working-directory: rider
        run: flutter build apk --release --split-per-abi

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider/build/app/outputs/flutter-apk/
          retention-days: 7
