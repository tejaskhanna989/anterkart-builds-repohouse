name: Build and Publish APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'customer/**'
      - 'vendor/**'
      - 'rider/**'
      - 'tools/**'
      - '.github/workflows/build-apks.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.3'
  # Every published variant of an app carries the same version code, so a user
  # can switch between the arm64 and armv7 build without Android treating the
  # second install as a downgrade.
  MIN_VERSION_CODE: '4002'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android command-line tools (apksigner, zipalign)
        run: |
          set -euo pipefail
          # ANDROID_HOME is exported through $GITHUB_ENV and therefore only
          # reaches the following steps. Every path inside this step has to be
          # spelled out, otherwise sdkmanager would install into a different
          # SDK than the one the build uses.
          SDK_ROOT="$HOME/android-cmdline-tools"
          mkdir -p "$SDK_ROOT"
          cd "$SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null 2>&1 || true
          # The build fails with a misleading "No Android SDK found" when the
          # SDK directory is incomplete, so it is verified here.
          for required in platform-tools build-tools platforms/android-36 cmdline-tools/latest/bin/sdkmanager; do
            if [ ! -e "$SDK_ROOT/$required" ]; then
              echo "::error::Android SDK component missing: $required"
              exit 1
            fi
          done
          echo "ANDROID_HOME=$SDK_ROOT"
          ls "$SDK_ROOT"

      # Signing is mandatory. An unsigned APK cannot be installed on a device,
      # so a build without the keystore must fail instead of publishing.
      - name: Prepare release signing material
        env:
          CUSTOMER_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64_CUSTOMER }}
          CUSTOMER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD_CUSTOMER }}
          CUSTOMER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_CUSTOMER }}
          CUSTOMER_KEY_ALIAS: ${{ secrets.KEY_ALIAS_CUSTOMER }}
          VENDOR_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64_VENDOR }}
          VENDOR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD_VENDOR }}
          VENDOR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_VENDOR }}
          VENDOR_KEY_ALIAS: ${{ secrets.KEY_ALIAS_VENDOR }}
          RIDER_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64_RIDER }}
          RIDER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD_RIDER }}
          RIDER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_RIDER }}
          RIDER_KEY_ALIAS: ${{ secrets.KEY_ALIAS_RIDER }}
        run: |
          set -euo pipefail
          prepare_keys() {
            local app="$1" base64="$2" store_pw="$3" key_pw="$4" alias="$5"
            if [ -z "$base64" ] || [ -z "$store_pw" ] || [ -z "$key_pw" ] || [ -z "$alias" ]; then
              echo "::error::Signing material for $app is missing. An unsigned APK cannot be published."
              exit 1
            fi
            echo "$base64" | base64 --decode > "$app/android/app/upload-keystore.jks"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$store_pw" "$key_pw" "$alias" > "$app/android/key.properties"
            chmod 600 "$app/android/app/upload-keystore.jks" "$app/android/key.properties"
            echo "Signing material prepared for $app"
          }
          prepare_keys customer "$CUSTOMER_KEYSTORE_BASE64" "$CUSTOMER_KEYSTORE_PASSWORD" "$CUSTOMER_KEY_PASSWORD" "$CUSTOMER_KEY_ALIAS"
          prepare_keys vendor "$VENDOR_KEYSTORE_BASE64" "$VENDOR_KEYSTORE_PASSWORD" "$VENDOR_KEY_PASSWORD" "$VENDOR_KEY_ALIAS"
          prepare_keys rider "$RIDER_KEYSTORE_BASE64" "$RIDER_KEYSTORE_PASSWORD" "$RIDER_KEY_PASSWORD" "$RIDER_KEY_ALIAS"

      - name: Ensure Gradle wrapper uses Gradle 8.14 (compatible with AGP 8.1.4)
        run: |
          set -euo pipefail
          for proj in customer vendor rider; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              sed -i "s|^distributionUrl=.*$|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip|" "$wrapper_props"
            fi
          done

      - name: Get Flutter dependencies
        run: |
          set -euo pipefail
          for proj in customer vendor rider; do
            (cd "$proj" && flutter pub get)
          done

      - name: Ensure Gradle wrapper stays at 8.14 after pub get
        run: |
          set -euo pipefail
          for proj in customer vendor rider; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              sed -i "s|^distributionUrl=.*$|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip|" "$wrapper_props"
            fi
          done

      # `flutter test` only compiles the files the tests import. A screen with
      # a compile error can therefore pass the test step and only break in the
      # much slower build step, so the whole app is analysed first.
      - name: Analyse the apps
        run: |
          set -euo pipefail
          failed=0
          for proj in customer vendor rider; do
            echo "::group::analyze $proj"
            if ! (cd "$proj" && flutter analyze --no-fatal-infos --no-fatal-warnings); then
              echo "::error::flutter analyze found errors in $proj"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Run tests
        run: |
          set -euo pipefail
          failed=0
          for proj in customer vendor rider; do
            echo "::group::tests $proj"
            if ! (cd "$proj" && flutter test); then
              echo "::error::flutter test failed for $proj"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      # Each ABI is built on its own with --target-platform instead of
      # --split-per-abi. A split build adds an ABI specific offset to the
      # version code (armv7 = base + 1000, arm64 = base + 2000, x86_64 =
      # base + 4000), which makes the three files mutually incompatible: the
      # second one installed would be rejected as a downgrade.
      #
      # A universal build is added on top. It contains every ABI and therefore
      # installs on any device, which removes the "wrong architecture" cause
      # of the package parsing error on the device.
      - name: Build release APKs
        run: |
          set -euo pipefail
          build_app() {
            local app="$1"
            local platform="$2" abi="$3"
            echo "::group::build $app ($abi)"
            (cd "$app" && flutter build apk --release --target-platform="$platform")
            local built="$app/build/app/outputs/flutter-apk/app-release.apk"
            if [ ! -f "$built" ]; then
              echo "::error::$app ($abi) produced no APK"
              exit 1
            fi
            mkdir -p "dist/$app"
            cp "$built" "dist/$app/app-$abi-release.apk"
            echo "::endgroup::"
          }
          build_universal() {
            local app="$1"
            echo "::group::build $app (universal)"
            (cd "$app" && flutter build apk --release)
            local built="$app/build/app/outputs/flutter-apk/app-release.apk"
            if [ ! -f "$built" ]; then
              echo "::error::$app (universal) produced no APK"
              exit 1
            fi
            mkdir -p "dist/$app"
            cp "$built" "dist/$app/app-universal-release.apk"
            echo "::endgroup::"
          }
          for app in customer vendor rider; do
            build_app "$app" android-arm64 arm64-v8a
            build_app "$app" android-arm armeabi-v7a
            build_app "$app" android-x64 x86_64
            build_universal "$app"
          done

      - name: Verify APK signatures, alignment and manifests
        env:
          CUSTOMER_CERT_SHA256: '63:9C:C1:34:EB:EF:92:23:DF:63:FF:32:C4:7E:95:AA:A8:FF:C9:41:A6:7D:9D:2E:15:CB:5B:A3:5B:E9:EA:CF'
          VENDOR_CERT_SHA256: '7F:0E:1B:24:AB:BE:7D:C0:67:29:82:B7:29:BA:63:74:A5:0C:EC:99:75:7C:9C:EE:A9:05:51:78:F7:7A:A8:DA'
          RIDER_CERT_SHA256: 'CD:E9:E5:E8:A3:0C:33:98:EE:10:25:6C:F6:66:94:92:C2:2D:77:2B:FC:E1:E4:6F:2C:7D:9F:99:39:F4:DD:8B'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          declare -A PACKAGE=( [customer]=com.otamzo.store [vendor]=com.otamzo.vendor [rider]=com.otamzo.rider )
          declare -A LABEL=( [customer]="Otamzo Store" [vendor]="Otamzo Vendor" [rider]="Otamzo Rider" )
          declare -A CERT=( [customer]="$CUSTOMER_CERT_SHA256" [vendor]="$VENDOR_CERT_SHA256" [rider]="$RIDER_CERT_SHA256" )

          for app in customer vendor rider; do
            echo "::group::verify $app"
            versions=""
            for apk in dist/$app/*.apk; do
              echo "-- $apk"
              "$ZIPALIGN" -c 4 "$apk"
              report=$("$APKSIGNER" verify --min-sdk-version 21 --print-certs -v "$apk" 2>&1) || {
                echo "$report"
                echo "::error::apksigner rejected $apk"
                exit 1
              }
              echo "$report" | grep -E "Verified using v[123] scheme|Signer #1 certificate SHA-256 digest"
              echo "$report" | grep -q "Verified using v2 scheme" || { echo "::error::$apk has no v2 signature"; exit 1; }
              echo "$report" | grep -q "Verified using v3 scheme" || { echo "::error::$apk has no v3 signature"; exit 1; }
              digest=$(echo "$report" | grep "Signer #1 certificate SHA-256 digest" | head -1 | sed 's/.*: //' | tr -d '\r' | tr -d ':' | tr 'A-Z' 'a-z')
              expected=$(echo "${CERT[$app]}" | tr -d ':' | tr 'A-Z' 'a-z')
              if [ "$digest" != "$expected" ]; then
                echo "::error::$apk is signed with $digest, expected $expected"
                exit 1
              fi
              facts=$(python3 tools/verify_apk.py "$apk" \
                --package "${PACKAGE[$app]}" \
                --label "${LABEL[$app]}" \
                --min-version-code "$MIN_VERSION_CODE")
              echo "$facts"
              vc=$(echo "$facts" | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p')
              versions="$versions $vc"
            done
            unique=$(echo "$versions" | tr ' ' '\n' | grep -v '^$' | sort -u | wc -l)
            if [ "$unique" -ne 1 ]; then
              echo "::error::$app has $unique different version codes ($versions). All variants must share one version code."
              exit 1
            fi
            echo "all variants of $app share version code$(echo "$versions" | tr -d ' ')"
            echo "::endgroup::"
          done

      - name: Generate checksum sidecars
        run: |
          set -euo pipefail
          for app in customer vendor rider; do
            (
              cd "dist/$app"
              sha1sum app-*-release.apk > checksums.sha1
              cp checksums.sha1 checksums.txt
              while read -r sum name; do
                printf '%s  %s\n' "$sum" "$name" > "$name.sha1"
              done < checksums.sha1
            )
          done
          cat dist/*/checksums.sha1

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: dist/customer/
          retention-days: 30

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: dist/vendor/
          retention-days: 30

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: dist/rider/
          retention-days: 30

      - name: Upload the download page
        uses: actions/upload-artifact@v4
        with:
          name: download-page
          path: tools/download/index.html
          retention-days: 30

  # Publishing is a separate job so that a failure while copying the release
  # to the server can be retried with `gh run rerun --failed` without paying
  # for another twelve Gradle builds.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Arrange the artifacts
        run: |
          set -euo pipefail
          for app in customer vendor rider; do
            if [ ! -d "release/$app-apk" ]; then
              echo "::error::The $app artifacts are missing"
              exit 1
            fi
            mkdir -p "release/$app"
            cp -a "release/$app-apk/." "release/$app/"
          done
          ls -l release/customer release/vendor release/rider

      - name: Install publishing tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          command -v sshpass

      - name: Publish the download page
        env:
          OTAMZO_SSH_PASSWORD: ${{ secrets.OTAMZO_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$OTAMZO_SSH_PASSWORD"
          SSH_HOST=91.108.107.50
          SSH_PORT=65002
          SSH_USER=u881842192
          WEBROOT=/home/u881842192/domains/otamzo.com/public_html
          sshpass -e scp -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            release/download-page/index.html "$SSH_USER@$SSH_HOST:/tmp/otamzo-download-index.html"
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            "$SSH_USER@$SSH_HOST" "install -m 644 /tmp/otamzo-download-index.html '$WEBROOT/download/index.html' && rm -f /tmp/otamzo-download-index.html"
          echo "download page published"

      - name: Publish APKs to production
        env:
          OTAMZO_SSH_PASSWORD: ${{ secrets.OTAMZO_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x tools/publish_apks.sh
          OTAMZO_DIST_ROOT=release ./tools/publish_apks.sh
