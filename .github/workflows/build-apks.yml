name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Fix Groovy QName issue by adding groovy-xml to Gradle buildscript classpath
      - name: Fix Groovy QName issue
        run: |
          # Create Gradle init script to add groovy-xml to buildscript classpath
          cat > /tmp/groovy-fix.gradle << 'EOF'
          gradle.buildStarted { build ->
            build.gradle.allprojects { project ->
              project.buildscript {
                dependencies {
                  classpath 'org.codehaus.groovy:groovy-xml:3.0.13'
                }
              }
            }
          }
          EOF
          
          # Apply to Gradle
          export GRADLE_USER_HOME=/tmp/gradle
          mkdir -p $GRADLE_USER_HOME/init.d
          cp /tmp/groovy-fix.gradle $GRADLE_USER_HOME/init.d/groovy-fix.gradle
          
          echo "Groovy fix applied to GRADLE_USER_HOME/init.d/"

      - name: Create fresh Flutter projects
        run: |
          flutter create --template=app --platforms=android customer_new
          flutter create --template=app --platforms=android vendor_new
          flutter create --template=app --platforms=android rider_new

      - name: Copy Dart code, assets, and Android config
        run: |
          # Customer
          cp -r customer/lib customer_new/lib
          cp -r customer/assets customer_new/assets 2>/dev/null || true
          cp customer/pubspec.yaml customer_new/pubspec.yaml
          cp -r customer/android customer_new/ 2>/dev/null || true
          # Vendor
          cp -r vendor/lib vendor_new/lib
          cp -r vendor/assets vendor_new/assets 2>/dev/null || true
          cp vendor/pubspec.yaml vendor_new/pubspec.yaml
          cp -r vendor/android vendor_new/ 2>/dev/null || true
          # Rider
          cp -r rider/lib rider_new/lib
          cp -r rider/assets rider_new/assets 2>/dev/null || true
          cp rider/pubspec.yaml rider_new/pubspec.yaml
          cp -r rider/android rider_new/ 2>/dev/null || true

      - name: Get Flutter dependencies
        run: |
          cd customer_new && flutter pub get
          cd ../vendor_new && flutter pub get
          cd ../rider_new && flutter pub get

      - name: Build Customer APK
        working-directory: customer_new
        run: flutter build apk --release --split-per-abi

      - name: Build Vendor APK
        working-directory: vendor_new
        run: flutter build apk --release --split-per-abi

      - name: Build Rider APK
        working-directory: rider_new
        run: flutter build apk --release --split-per-abi

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer_new/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor_new/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider_new/build/app/outputs/flutter-apk/
          retention-days: 7