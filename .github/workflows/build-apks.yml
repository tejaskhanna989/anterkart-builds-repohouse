name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Gradle 9.3.1 locally (required by Flutter 3.47)
        run: |
          mkdir -p $HOME/gradle-download
          cd $HOME/gradle-download
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-all.zip -O gradle-9.3.1-all.zip
          echo "Gradle downloaded: $(ls -la gradle-9.3.1-all.zip)"

      - name: Fix Gradle wrapper to use Gradle 9.3.1 for all apps
        run: |
          GRADLE_931="file://${HOME}/gradle-download/gradle-9.3.1-all.zip"
          for proj in customer vendor rider; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              echo "Setting $wrapper_props to Gradle 9.3.1"
              sed -i "s|^distributionUrl=.*$|distributionUrl=${GRADLE_931}|" "$wrapper_props"
              cat "$wrapper_props"
            fi
          done

      - name: Get Flutter dependencies (Customer)
        working-directory: customer
        run: |
          flutter pub get

      - name: Get Flutter dependencies (Vendor)
        working-directory: vendor
        run: |
          flutter pub get

      - name: Get Flutter dependencies (Rider)
        working-directory: rider
        run: |
          flutter pub get

      - name: Re-fix Gradle wrapper after pub get
        run: |
          GRADLE_931="file://${HOME}/gradle-download/gradle-9.3.1-all.zip"
          for proj in customer vendor rider; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              echo "Re-fixing $wrapper_props to Gradle 9.3.1"
              sed -i "s|^distributionUrl=.*$|distributionUrl=${GRADLE_931}|" "$wrapper_props"
            fi
          done

      - name: Build Customer APK
        working-directory: customer
        run: flutter build apk --release --split-per-abi

      - name: Build Vendor APK
        working-directory: vendor
        run: flutter build apk --release --split-per-abi

      - name: Build Rider APK
        working-directory: rider
        run: flutter build apk --release --split-per-abi
        continue-on-error: true

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Download Customer APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: customer-apk
          path: customer-artifacts

      - name: Download Vendor APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: vendor-apk
          path: vendor-artifacts

      - name: Download Rider APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: rider-apk
          path: rider-artifacts

      - name: Deploy APKs to VPS
        if: false  # Disabled until SSH key is properly configured
        run: |
          echo "Build successful! APKs are ready for deployment."
          echo "Customer APKs: $(ls customer-artifacts/*.apk 2>/dev/null || echo 'Not found')"
          echo "Vendor APKs: $(ls vendor-artifacts/*.apk 2>/dev/null || echo 'Not found')"
          echo "Rider APKs: $(ls rider-artifacts/*.apk 2>/dev/null || echo 'Not found')"
          echo "Deployment is disabled until SSH key is properly configured"
