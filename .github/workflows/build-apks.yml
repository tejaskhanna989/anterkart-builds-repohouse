name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch Flutter SDK gradle plugin (fix Groovy QName/XmlParser)
        run: |
          # Detect Flutter root directory
          if [ -n "$FLUTTER_ROOT" ]; then
            FLUTTER_BASE="$FLUTTER_ROOT"
          elif [ -d "$HOME/flutter" ]; then
            FLUTTER_BASE="$HOME/flutter"
          else
            FLUTTER_BASE="$(dirname "$(dirname "$(which flutter)")")"
          fi
          FLUTTER_GROOVY="$FLUTTER_BASE/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          echo "Flutter base: $FLUTTER_BASE"
          echo "Flutter groovy: $FLUTTER_GROOVY"
          if [ -f "$FLUTTER_GROOVY" ]; then
            cp "$FLUTTER_GROOVY" "$FLUTTER_GROOVY.backup"
            python3 .github/scripts/patch_flutter_groovy.py "$FLUTTER_GROOVY"
            if [ $? -ne 0 ]; then
              echo "Python patch script failed"
              exit 1
            fi
            echo "Patched flutter.groovy successfully"
          else
            echo "WARNING: flutter.groovy not found at $FLUTTER_GROOVY"
          fi

      - name: Download Gradle versions locally (fix GitHub CDN 504)
        run: |
          mkdir -p $HOME/gradle-download
          cd $HOME/gradle-download
          # Gradle 8.13 for Customer and Vendor (works with their AGP)
          wget -q https://services.gradle.org/distributions/gradle-8.13-all.zip -O gradle-8.13-all.zip
          # Gradle 9.3.1 for Rider (required by Rider's AGP/Kotlin plugin)
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-all.zip -O gradle-9.3.1-all.zip
          echo "Gradle versions downloaded:"
          ls -la $HOME/gradle-download/

      - name: Fix Gradle wrapper to use local Gradle URLs
        run: |
          # Customer and Vendor use Gradle 8.13
          GRADLE_813="file://${HOME}/gradle-download/gradle-8.13-all.zip"
          GRADLE_931="file://${HOME}/gradle-download/gradle-9.3.1-all.zip"
          for proj in customer vendor; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              echo "Setting $wrapper_props to Gradle 8.13"
              sed -i "s|^distributionUrl=.*$|distributionUrl=${GRADLE_813}|" "$wrapper_props"
              cat "$wrapper_props"
            fi
          done
          # Rider uses Gradle 9.3.1
          wrapper_props="rider/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$wrapper_props" ]; then
            echo "Setting $wrapper_props to Gradle 9.3.1"
            sed -i "s|^distributionUrl=.*$|distributionUrl=${GRADLE_931}|" "$wrapper_props"
            cat "$wrapper_props"
          fi

      - name: Get Flutter dependencies (Customer)
        working-directory: customer
        run: |
          flutter pub get

      - name: Get Flutter dependencies (Vendor)
        working-directory: vendor
        run: |
          flutter pub get

      - name: Get Flutter dependencies (Rider)
        working-directory: rider
        run: |
          flutter pub get

      - name: Re-fix Gradle wrapper after pub get
        run: |
          GRADLE_813="file://${HOME}/gradle-download/gradle-8.13-all.zip"
          GRADLE_931="file://${HOME}/gradle-download/gradle-9.3.1-all.zip"
          for proj in customer vendor; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              current=$(grep "^distributionUrl=" "$wrapper_props")
              if [[ "$current" != *"file://"* ]]; then
                echo "Re-fixing $wrapper_props to Gradle 8.13"
                sed -i "s|^distributionUrl=.*$|distributionUrl=${GRADLE_813}|" "$wrapper_props"
              fi
            fi
          done
          wrapper_props="rider/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$wrapper_props" ]; then
            current=$(grep "^distributionUrl=" "$wrapper_props")
            if [[ "$current" != *"file://"* ]]; then
              echo "Re-fixing $wrapper_props to Gradle 9.3.1"
              sed -i "s|^distributionUrl=.*$|distributionUrl=${GRADLE_931}|" "$wrapper_props"
            fi
          fi

      - name: Build Customer APK
        working-directory: customer
        run: flutter build apk --release --split-per-abi

      - name: Build Vendor APK
        working-directory: vendor
        run: flutter build apk --release --split-per-abi

      - name: Build Rider APK
        working-directory: rider
        run: flutter build apk --release --split-per-abi

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider/build/app/outputs/flutter-apk/
          retention-days: 7
