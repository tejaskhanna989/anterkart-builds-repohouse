name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Gradle 8.13 locally (fix GitHub CDN 504)
        run: |
          mkdir -p $HOME/gradle-download
          cd $HOME/gradle-download
          wget -q https://services.gradle.org/distributions/gradle-8.13-all.zip -O gradle-8.13-all.zip
          echo "Gradle downloaded: $(ls -la gradle-8.13-all.zip)"

      - name: Fix Gradle wrapper to use Gradle 8.13 for all apps
        run: |
          GRADLE_813="file://${HOME}/gradle-download/gradle-8.13-all.zip"
          for proj in customer vendor rider; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              echo "Setting $wrapper_props to Gradle 8.13"
              sed -i "s|^distributionUrl=.*$|distributionUrl=${GRADLE_813}|" "$wrapper_props"
              cat "$wrapper_props"
            fi
          done

      - name: Get Flutter dependencies (Customer)
        working-directory: customer
        run: |
          flutter pub get

      - name: Get Flutter dependencies (Vendor)
        working-directory: vendor
        run: |
          flutter pub get

      - name: Get Flutter dependencies (Rider)
        working-directory: rider
        run: |
          flutter pub get

      - name: Re-fix Gradle wrapper after pub get
        run: |
          GRADLE_813="file://${HOME}/gradle-download/gradle-8.13-all.zip"
          for proj in customer vendor rider; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              echo "Re-fixing $wrapper_props to Gradle 8.13"
              sed -i "s|^distributionUrl=.*$|distributionUrl=${GRADLE_813}|" "$wrapper_props"
            fi
          done

      - name: Build Customer APK
        working-directory: customer
        run: flutter build apk --release --split-per-abi

      - name: Build Vendor APK
        working-directory: vendor
        run: flutter build apk --release --split-per-abi

      - name: Build Rider APK
        working-directory: rider
        run: flutter build apk --release --split-per-abi
        continue-on-error: true

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Deploy APKs to VPS
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          VPS_HOST="91.108.107.50"
          VPS_PORT="65002"
          VPS_USER="root"
          VPS_PASS="${{ secrets.OTAMZO_SSH_PASSWORD }}"
          VPS_DIR="/var/www/apk"
          
          echo "Creating remote directory..."
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p $VPS_DIR/customer $VPS_DIR/vendor $VPS_DIR/rider"
          
          echo "Deploying Customer APKs..."
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no -P "$VPS_PORT" customer/build/app/outputs/flutter-apk/*.apk "$VPS_USER@$VPS_HOST:$VPS_DIR/customer/"
          
          echo "Deploying Vendor APKs..."
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no -P "$VPS_PORT" vendor/build/app/outputs/flutter-apk/*.apk "$VPS_USER@$VPS_HOST:$VPS_DIR/vendor/"
          
          echo "Deploying Rider APKs..."
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no -P "$VPS_PORT" rider/build/app/outputs/flutter-apk/*.apk "$VPS_USER@$VPS_HOST:$VPS_DIR/rider/"
          
          echo "Deployment complete!"
