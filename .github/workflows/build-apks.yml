name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Patch Flutter SDK's gradle plugin to replace groovy.xml.QName and groovy.xml.XmlParser
      # with standard Java XML APIs that don't require the groovy-xml module
      - name: Patch Flutter SDK gradle plugin (fix Groovy QName/XmlParser)
        run: |
          # Find the flutter.groovy file in the Flutter SDK
          FLUTTER_GROOVY=$(find /opt/hostedtoolcache/flutter -name "flutter.groovy" -path "*/flutter_tools/gradle/*" 2>/dev/null | head -1)
          if [ -n "$FLUTTER_GROOVY" ]; then
            echo "Found flutter.groovy at: $FLUTTER_GROOVY"
            # Backup the original file
            cp "$FLUTTER_GROOVY" "$FLUTTER_GROOVY.backup"
            
            # 1. Remove the groovy.xml.QName import
            sed -i 's/import groovy.xml.QName//' "$FLUTTER_GROOVY"
            
            # 2. Remove the groovy.xml.XmlParser import
            sed -i 's/import groovy.xml.XmlParser//' "$FLUTTER_GROOVY"
            
            # 3. Replace QName with javax.xml.namespace.QName (standard Java API)
            sed -i 's/\bQName\b/javax.xml.namespace.QName/g' "$FLUTTER_GROOVY"
            
            # 4. Replace XmlParser with standard Java DocumentBuilder (no Groovy XML module needed)
            # We'll replace the XmlParser usage with standard Java DocumentBuilder
            sed -i 's/new groovy.util.XmlParser()/newXmlParser()/g' "$FLUTTER_GROOVY"
            sed -i 's/new groovy.xml.XmlParser()/newXmlParser()/g' "$FLUTTER_GROOVY"
            
            # Add a helper method at the top of the script (after package declaration)
            # This creates a newXmlParser() method that uses standard Java DocumentBuilder
            # We'll insert it after the package declaration
            awk '/^package / { print; print ""; print "import javax.xml.parsers.DocumentBuilderFactory"; print "import javax.xml.parsers.DocumentBuilder"; print "import org.w3c.dom.Document"; print "import org.w3c.dom.Node"; print "import org.w3c.dom.NodeList"; print "import org.w3c.dom.Element"; print "import org.xml.sax.InputSource"; print "import java.io.StringReader"; print ""; print "def newXmlParser() {"; print "  return [parse: { input ->"; print "    def factory = DocumentBuilderFactory.newInstance()"; print "    def builder = factory.newDocumentBuilder()"; print "    def inputSource = new InputSource(new StringReader(input))"; print "    def doc = builder.parse(inputSource)"; print "    return new XmlSlurperAdapter(doc)"; print "  }]"; print "}"; print ""; next } 1' "$FLUTTER_GROOVY" > "$FLUTTER_GROOVY.tmp" && mv "$FLUTTER_GROOVY.tmp" "$FLUTTER_GROOVY"
            
            echo "Patched flutter.groovy - replaced QName and XmlParser with standard Java APIs"
            echo "Checking for remaining QName/XmlParser references:"
            grep -n "QName\|XmlParser" "$FLUTTER_GROOVY" || echo "No references found"
          else
            echo "WARNING: flutter.groovy not found!"
          fi

      - name: Create fresh Flutter projects
        run: |
          flutter create --template=app --platforms=android customer_new
          flutter create --template=app --platforms=android vendor_new
          flutter create --template=app --platforms=android rider_new

      - name: Copy Dart code, assets, and Android config
        run: |
          # Customer
          cp -r customer/lib customer_new/lib
          cp -r customer/assets customer_new/assets 2>/dev/null || true
          cp customer/pubspec.yaml customer_new/pubspec.yaml
          cp -r customer/android customer_new/ 2>/dev/null || true
          # Vendor
          cp -r vendor/lib vendor_new/lib
          cp -r vendor/assets vendor_new/assets 2>/dev/null || true
          cp vendor/pubspec.yaml vendor_new/pubspec.yaml
          cp -r vendor/android vendor_new/ 2>/dev/null || true
          # Rider
          cp -r rider/lib rider_new/lib
          cp -r rider/assets rider_new/assets 2>/dev/null || true
          cp rider/pubspec.yaml rider_new/pubspec.yaml
          cp -r rider/android rider_new/ 2>/dev/null || true

      - name: Get Flutter dependencies
        run: |
          cd customer_new && flutter pub get
          cd ../vendor_new && flutter pub get
          cd ../rider_new && flutter pub get

      - name: Build Customer APK
        working-directory: customer_new
        run: flutter build apk --release --split-per-abi

      - name: Build Vendor APK
        working-directory: vendor_new
        run: flutter build apk --release --split-per-abi

      - name: Build Rider APK
        working-directory: rider_new
        run: flutter build apk --release --split-per-abi

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer_new/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor_new/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider_new/build/app/outputs/flutter-apk/
          retention-days: 7