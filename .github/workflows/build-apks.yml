name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Patch Flutter SDK's gradle plugin to fix Groovy QName/XmlParser issue
      - name: Patch Flutter SDK gradle plugin (fix Groovy QName/XmlParser)
        run: |
          FLUTTER_GROOVY="/opt/hostedtoolcache/flutter/stable-3.22.0-x64/flutter/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          if [ -f "$FLUTTER_GROOVY" ]; then
            echo "Found flutter.groovy at: $FLUTTER_GROOVY"
            # Backup the original file
            cp "$FLUTTER_GROOVY" "$FLUTTER_GROOVY.backup"
            
            # Use Python to properly patch the file
            python3 << 'PYEOF'
import re

flut_file = "/opt/hostedtoolcache/flutter/stable-3.22.0-x64/flutter/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"

with open(flut_file, 'r') as f:
    content = f.read()

print(f"Original file size: {len(content)}")

# 1. Remove the groovy.xml.QName import
content = re.sub(r'import groovy\.xml\.QName\s*\n', '', content)

# 2. Remove the groovy.xml.XmlParser import
content = re.sub(r'import groovy\.xml\.XmlParser\s*\n', '', content)

# 3. Replace QName with javax.xml.namespace.QName (standard Java API)
content = re.sub(r'\bQName\b', 'javax.xml.namespace.QName', content)

# 4. Add necessary imports after package declaration
imports = """import javax.xml.parsers.DocumentBuilderFactory
import javax.xml.parsers.DocumentBuilder
import org.w3c.dom.Document
import org.w3c.dom.Node
import org.w3c.dom.NodeList
import org.w3c.dom.Element
import org.xml.sax.InputSource
import java.io.StringReader
"""

# Add imports after package declaration
content = re.sub(r'(^package .*\n)', r'\1\n' + imports + '\n', content, count=1)

# 5. Replace XmlParser usage with newXmlParser()
content = re.sub(r'new XmlParser\(\)', 'newXmlParser()', content)
content = re.sub(r'new groovy\.util\.XmlParser\(\)', 'newXmlParser()', content)
content = re.sub(r'new groovy\.xml\.XmlParser\(\)', 'newXmlParser()', content)

# 6. Add the newXmlParser helper method and XmlSlurperAdapter class
helper_code = """

def newXmlParser() {
  return [parse: { input ->
    def factory = DocumentBuilderFactory.newInstance()
    def builder = factory.newDocumentBuilder()
    def inputSource = new InputSource(new StringReader(input))
    def doc = builder.parse(inputSource)
    return new XmlSlurperAdapter(doc)
  }]
}

class XmlSlurperAdapter {
  Document doc
  XmlSlurperAdapter(Document doc) { this.doc = doc }
  def getAt(String name) {
    def nodes = doc.getElementsByTagName(name)
    if (nodes.getLength() == 0) return null
    if (nodes.getLength() == 1) return new XmlSlurperAdapter(nodes.item(0))
    def list = []
    for (int i = 0; i < nodes.getLength(); i++) {
      list << new XmlSlurperAdapter(nodes.item(i))
    }
    return list
  }
  String toString() { doc.getTextContent() }
}

"""

# Find the first 'def ' or 'class ' and insert before it
content = re.sub(r'(^def |^class )', helper_code + r'\1', content, count=1, flags=re.MULTILINE)

# Write the patched file
with open("/opt/hostedtoolcache/flutter/stable-3.22.0-x64/flutter/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy", 'w') as f:
    f.write(content)

print("Patched flutter.groovy successfully")
PYEOF
            
            echo "Patched flutter.groovy - replaced QName and XmlParser with standard Java APIs"
            echo "Checking for remaining QName/XmlParser references:"
            grep -n "QName\|XmlParser" "/opt/hostedtoolcache/flutter/stable-3.22.0-x64/flutter/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy" || echo "No references found"
          else
            echo "WARNING: flutter.groovy not found at expected path!"
            find /opt/hostedtoolcache/flutter -name "flutter.groovy" 2>/dev/null
          fi

      - name: Create fresh Flutter projects
        run: |
          flutter create --template=app --platforms=android customer_new
          flutter create --template=app --platforms=android vendor_new
          flutter create --template=app --platforms=android rider_new

      - name: Copy Dart code, assets, and Android config
        run: |
          # Customer
          cp -r customer/lib customer_new/lib
          cp -r customer/assets customer_new/assets 2>/dev/null || true
          cp customer/pubspec.yaml customer_new/pubspec.yaml
          cp -r customer/android customer_new/ 2>/dev/null || true
          # Vendor
          cp -r vendor/lib vendor_new/lib
          cp -r vendor/assets vendor_new/assets 2>/dev/null || true
          cp vendor/pubspec.yaml vendor_new/pubspec.yaml
          cp -r vendor/android vendor_new/ 2>/dev/null || true
          # Rider
          cp -r rider/lib rider_new/lib
          cp -r rider/assets rider_new/assets 2>/dev/null || true
          cp rider/pubspec.yaml rider_new/pubspec.yaml
          cp -r rider/android rider_new/ 2>/dev/null || true

      - name: Get Flutter dependencies
        run: |
          cd customer_new && flutter pub get
          cd ../vendor_new && flutter pub get
          cd ../rider_new && flutter pub get

      - name: Build Customer APK
        working-directory: customer_new
        run: flutter build apk --release --split-per-abi

      - name: Build Vendor APK
        working-directory: vendor_new
        run: flutter build apk --release --split-per-abi

      - name: Build Rider APK
        working-directory: rider_new
        run: flutter build apk --release --split-per-abi

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer_new/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor_new/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider_new/build/app/outputs/flutter-apk/
          retention-days: 7