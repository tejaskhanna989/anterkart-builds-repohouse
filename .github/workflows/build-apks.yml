name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch Flutter SDK gradle plugin (fix Groovy QName/XmlParser)
        run: |
          FLUTTER_GROOVY="$HOME/flutter/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          if [ -f "$FLUTTER_GROOVY" ]; then
            cp "$FLUTTER_GROOVY" "$FLUTTER_GROOVY.backup"
            python3 .github/scripts/patch_flutter_groovy.py "$FLUTTER_GROOVY"
            if [ $? -ne 0 ]; then
              echo "Python patch script failed"
              exit 1
            fi
            echo "Patched flutter.groovy successfully"
          else
            echo "WARNING: flutter.groovy not found at $FLUTTER_GROOVY"
          fi

      - name: Get Flutter dependencies (Customer)
        working-directory: customer
        run: |
          flutter pub get

      - name: Get Flutter dependencies (Vendor)
        working-directory: vendor
        run: |
          flutter pub get

      - name: Get Flutter dependencies (Rider)
        working-directory: rider
        run: |
          flutter pub get

      - name: Fix Gradle wrapper distribution URL
        run: |
          for proj in customer vendor rider; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              echo "Original $wrapper_props:"
              cat "$wrapper_props"
              # Force distributionUrl to services.gradle.org - use Gradle 8.13 (minimum required)
              sed -i 's|^distributionUrl=.*$|distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip|' "$wrapper_props"
              echo "Fixed $wrapper_props:"
              cat "$wrapper_props"
            else
              echo "NOT FOUND: $wrapper_props"
            fi
          done

      - name: Build Customer APK
        working-directory: customer
        run: flutter build apk --release --split-per-abi

      - name: Build Vendor APK
        working-directory: vendor
        run: flutter build apk --release --split-per-abi

      - name: Build Rider APK
        working-directory: rider
        run: flutter build apk --release --split-per-abi

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider/build/app/outputs/flutter-apk/
          retention-days: 7
