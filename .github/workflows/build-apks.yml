name: Build APKs
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.22.0
        channel: stable
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Patch Flutter SDK gradle plugin (fix Groovy QName/XmlParser)
      shell: pwsh
      run: "$flutterGroovy = \"C:\\hostedtoolcache\\windows\\flutter\\3.22.0\\x64\\flutter\\packages\\flutter_tools\\gradle\\src\\main\\groovy\\flutter.groovy\"\nif (Test-Path $flutterGroovy) {\n  Write-Host\
        \ \"Found flutter.groovy at: $flutterGroovy\"\n  Copy-Item \"$flutterGroovy\" \"$flutterGroovy.backup\"\n  \n  $pythonScript = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String(\"\
        \
        \ aXN0CmltcG9ydCBvcmcudzNjLmRvbS5FbGVtZW50CmltcG9ydCBvcmcudzNjLmRvbS5Ob2RlTGlzdAotaW1wb3J0IG9yZy53M2MuZG9tLkVsZW1lbnQKaW1wb3J0IG9yZy53M2MuZG9tLk5vZGVM \n\
        \"@\n            Set-Content -Path \"C:\\patch_flutter.py\" -Value $patchScript -Encoding UTF8\n            python3 \"C:\\patch_flutter.py\" 2>&1\n            if ($LASTEXITCODE -ne 0) {\n  Write-Error\
        \ \"Python patch script failed\"\n  exit 1\n            }\n            Write-Host \"Patched flutter.groovy successfully\"\n            Write-Host \"Checking for remaining QName/XmlParser references:\"\
        \n            Select-String -Pattern \"QName|XmlParser\" -Path \"C:\\hostedtoolcache\\windows\\flutter\\3.22.0\\x64\\flutter\\packages\\flutter_tools\\gradle\\src\\main\\groovy\\flutter.groovy\"\
        \ | ForEach-Object { Write-Host \"$($_.LineNumber): $($_.Line)\" } | Out-Host\n            if (-not (Select-String -Pattern \"QName|XmlParser\" -Path \"C:\\hostedtoolcache\\windows\\flutter\\3.22.0\\\
        x64\\flutter\\packages\\flutter_tools\\gradle\\src\\main\\groovy\\flutter.groovy\")) {\n              Write-Host \"No references found\"\n            }\n          } else {\n            Write-Host\
        \ \"WARNING: flutter.groovy not found at expected path!\"\n            Get-ChildItem -Path \"C:\\hostedtoolcache\\windows\\flutter\" -Filter \"flutter.groovy\" -Recurse -ErrorAction SilentlyContinue\n\
        \          }"
    - name: Fix Kotlin version in generated projects
      shell: pwsh
      run: "# Update Kotlin version to 1.9.10 in generated projects\n$projects = @(\"customer_new\", \"vendor_new\", \"rider_new\")\nforeach ($project in $projects) {\n  $buildGradle = \"$project\\android\\\
        app\\build.gradle.kts\"\n  if (Test-Path $buildGradle) {\n    $content = Get-Content $buildGradle -Raw\n    # Update Kotlin version to 1.9.10\n    $content = $content -replace 'version \"1\\.7\\\
        .[0-9]+\"', 'version \"1.9.10\"'\n    $content = $content -replace 'version \"1\\.8\\.[0-9]+\"', 'version \"1.9.10\"'\n    $content = $content -replace 'version \"1\\.9\\.[0-9]+\"', 'version \"\
        1.9.10\"'\n    # Also update the Kotlin plugin version in the plugins block\n    $content = $content -replace 'id\\(\"org\\.jetbrains\\.kotlin\\.android\"\\) version \"[^\"]*\"', 'id(\"org.jetbrains.kotlin.android\"\
        ) version \"1.9.10\"'\n    Set-Content -Path $buildGradle -Value $content -Encoding UTF8\n    Write-Host \"Updated Kotlin version in $buildGradle\"\n  }\n  \n  # Also update settings.gradle.kts\
        \ if needed\n  $settingsGradle = \"$project\\android\\settings.gradle.kts\"\n  if (Test-Path $settingsGradle) {\n    $content = Get-Content $settingsGradle -Raw\n    $content = $content -replace\
        \ 'id\\(\"org\\.jetbrains\\.kotlin\\.android\"\\) version \"[^\"]*\"', 'id(\"org.jetbrains.kotlin.android\") version \"1.9.10\"'\n    Set-Content -Path $settingsGradle -Value $content -Encoding\
        \ UTF8\n    Write-Host \"Updated Kotlin version in $settingsGradle\"\n  }\n}"
    - name: Create fresh Flutter projects
      shell: pwsh
      run: 'flutter create --template=app --platforms=android customer_new

        flutter create --template=app --platforms=android vendor_new

        flutter create --template=app --platforms=android rider_new'
    - name: Copy Dart code, assets, and Android config
      shell: pwsh
      run: '# Customer

        Copy-Item -Path customer\lib -Destination customer_new\lib -Recurse -Force

        Copy-Item -Path customer\assets -Destination customer_new\assets -Recurse -Force -ErrorAction SilentlyContinue

        Copy-Item -Path customer\pubspec.yaml -Destination customer_new\pubspec.yaml -Force

        Copy-Item -Path customer\android -Destination customer_new\android -Recurse -Force -ErrorAction SilentlyContinue

        # Vendor

        Copy-Item -Path vendor\lib -Destination vendor_new\lib -Recurse -Force

        Copy-Item -Path vendor\assets -Destination vendor_new\assets -Recurse -Force -ErrorAction SilentlyContinue

        Copy-Item -Path vendor\pubspec.yaml -Destination vendor_new\pubspec.yaml -Force

        Copy-Item -Path vendor\android -Destination vendor_new\android -Recurse -Force -ErrorAction SilentlyContinue

        # Rider

        Copy-Item -Path rider\lib -Destination rider_new\lib -Recurse -Force

        Copy-Item -Path rider\assets -Destination rider_new\assets -Recurse -Force -ErrorAction SilentlyContinue

        Copy-Item -Path rider\pubspec.yaml -Destination rider_new\pubspec.yaml -Force

        Copy-Item -Path rider\android -Destination rider_new\android -Recurse -Force -ErrorAction SilentlyContinue'
    - name: Get Flutter dependencies
      shell: pwsh
      run: 'Set-Location customer_new

        flutter pub get

        Set-Location ../vendor_new

        flutter pub get

        Set-Location ../rider_new

        flutter pub get'
    - name: Build Customer APK
      working-directory: customer_new
      shell: pwsh
      run: flutter build apk --release --split-per-abi
    - name: Build Vendor APK
      working-directory: vendor_new
      shell: pwsh
      run: flutter build apk --release --split-per-abi
    - name: Build Rider APK
      working-directory: rider_new
      shell: pwsh
      run: flutter build apk --release --split-per-abi
    - name: Upload Customer APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: customer-apk
        path: customer_new/build/app/outputs/flutter-apk/
        retention-days: 7
    - name: Upload Vendor APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vendor-apk
        path: vendor_new/build/app/outputs/flutter-apk/
        retention-days: 7
    - name: Upload Rider APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rider-apk
        path: rider_new/build/app/outputs/flutter-apk/
        retention-days: 7
