name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android command-line tools (for apksigner, zipalign)
        run: |
          mkdir -p $HOME/android-cmdline-tools
          cd $HOME/android-cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-cmdline-tools" >> $GITHUB_ENV
          echo "$HOME/android-cmdline-tools/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $HOME/android-cmdline-tools/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/android-cmdline-tools/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "Android tools installed"

      - name: Ensure Gradle wrapper uses Gradle 8.14 (compatible with AGP 8.1.4)
        run: |
          for proj in customer vendor rider; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              echo "Setting $wrapper_props to Gradle 8.14"
              sed -i "s|^distributionUrl=.*$|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip|" "$wrapper_props"
            fi
          done

      - name: Get Flutter dependencies (Customer)
        working-directory: customer
        run: |
          flutter pub get

      - name: Get Flutter dependencies (Vendor)
        working-directory: vendor
        run: |
          flutter pub get

      - name: Get Flutter dependencies (Rider)
        working-directory: rider
        run: |
          flutter pub get

      - name: Ensure Gradle wrapper stays at 8.14 after pub get
        run: |
          for proj in customer vendor rider; do
            wrapper_props="$proj/android/gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$wrapper_props" ]; then
              sed -i "s|^distributionUrl=.*$|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip|" "$wrapper_props"
            fi
          done

      - name: Build Customer APK
        working-directory: customer
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD_CUSTOMER }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_CUSTOMER }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS_CUSTOMER }}
        run: |
          flutter build apk --release --split-per-abi

      - name: Build Vendor APK
        working-directory: vendor
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD_VENDOR }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_VENDOR }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS_VENDOR }}
        run: |
          flutter build apk --release --split-per-abi

      - name: Build Rider APK
        working-directory: rider
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD_RIDER }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_RIDER }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS_RIDER }}
        run: |
          flutter build apk --release --split-per-abi

      - name: Sign APKs with v2/v3 signatures for Android 11 (Customer)
        working-directory: customer
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f 2>/dev/null | head -1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" -type f 2>/dev/null | head -1)
          for apk in build/app/outputs/flutter-apk/app-release-*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing $apk with v2/v3..."
              "$APKSIGNER" sign --ks upload-keystore.jks --ks-key-alias upload --v2-signing-enabled true --v3-signing-enabled true "$apk"
              "$ZIPALIGN" -v -p 4 "$apk" "${apk%.apk}-aligned.apk"
            fi
          done

      - name: Sign APKs with v2/v3 signatures for Android 11 (Vendor)
        working-directory: vendor
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f 2>/dev/null | head -1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" -type f 2>/dev/null | head -1)
          for apk in build/app/outputs/flutter-apk/app-release-*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing $apk with v2/v3..."
              "$APKSIGNER" sign --ks upload-keystore.jks --ks-key-alias upload --v2-signing-enabled true --v3-signing-enabled true "$apk"
              "$ZIPALIGN" -v -p 4 "$apk" "${apk%.apk}-aligned.apk"
            fi
          done

      - name: Sign APKs with v2/v3 signatures for Android 11 (Rider)
        working-directory: rider
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f 2>/dev/null | head -1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" -type f 2>/dev/null | head -1)
          for apk in build/app/outputs/flutter-apk/app-release-*.apk; do
            if [ -f "$apk" ]; then
              echo "Signing $apk with v2/v3..."
              "$APKSIGNER" sign --ks upload-keystore.jks --ks-key-alias upload --v2-signing-enabled true --v3-signing-enabled true "$apk"
              "$ZIPALIGN" -v -p 4 "$apk" "${apk%.apk}-aligned.apk"
            fi
          done

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider/build/app/outputs/flutter-apk/
          retention-days: 7
