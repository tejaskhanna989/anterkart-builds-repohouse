name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Force compileSdk/targetSdk to API 34
        run: |
          for app in customer vendor rider; do
            f="$app/android/app/build.gradle.kts"
            if [ -f "$f" ]; then
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' "$f"
              sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' "$f"
            fi
          done

      - name: Get Flutter dependencies
        run: |
          cd customer && flutter pub get
          cd ../vendor && flutter pub get
          cd ../rider && flutter pub get

      - name: Build Customer APK
        working-directory: customer
        run: flutter build apk --release --split-per-abi

      - name: Build Vendor APK
        working-directory: vendor
        run: flutter build apk --release --split-per-abi

      - name: Build Rider APK
        working-directory: rider
        run: flutter build apk --release --split-per-abi

      - name: Upload Customer APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: customer/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Vendor APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendor-apk
          path: vendor/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Upload Rider APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rider-apk
          path: rider/build/app/outputs/flutter-apk/
          retention-days: 7